# 本机内存有限（15G 且常驻 IDE），Gradle/ Kotlin 守护进程堆不宜过大，否则 G1 预留 mmap 会失败。
# Metaspace 是本地内存（非堆）：加入 Room/KSP 注解处理后，512m 会在每次构建后耗尽并回收守护进程，
# 故提到 768m/512m；堆仍是 -Xmx2g/-Xmx1g。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m

org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 守护进程 JVM 条件（gradle-daemon-jvm.properties）要求 JDK 25；
# 本机的 25 在 Android Studio 的 JBR 目录里，Gradle 不自动扫描，需显式注册（GitHub 下载当前不可达）
org.gradle.java.installations.paths=D:/Program Files/Android/Android Studio/jbr

# AGP 9 的内置 Kotlin 支持会与 org.jetbrains.kotlin.android 插件争夺 kotlin 扩展，故关闭
android.builtInKotlin=false
android.newDsl=false
android.r8.gradual.support=true

kotlin.code.style=official
